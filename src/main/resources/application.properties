spring.application.name=arrango

# Logging
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.example.arrango=${LOG_LEVEL_APP:INFO}

# ArangoDB
arangodb.host=${ARANGODB_HOST:localhost}
arangodb.port=${ARANGODB_PORT:8529}
arangodb.user=${ARANGODB_USER:root}
arangodb.password=${ARANGODB_PASSWORD:}
arangodb.database=${ARANGODB_DATABASE:arrango}
# offene Migrationen beim Start ausführen; schlägt eine fehl, startet die App nicht
arangodb.migrations.on-startup=${ARANGODB_MIGRATIONS_ON_STARTUP:true}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Fehler als RFC 9457 Problem Details, inkl. Begründung (z. B. welche Ressource bei 404 fehlt)
spring.mvc.problemdetails.enabled=true

# Lean Tomcat
server.port=${SERVER_PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.tomcat.threads.max=${TOMCAT_THREADS_MAX:20}
server.tomcat.threads.min-spare=${TOMCAT_THREADS_MIN_SPARE:2}
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:50}
server.tomcat.max-connections=${TOMCAT_MAX_CONNECTIONS:200}
server.tomcat.connection-timeout=5s
server.tomcat.keep-alive-timeout=15s
server.tomcat.max-keep-alive-requests=100
server.tomcat.max-http-form-post-size=1MB
server.tomcat.max-swallow-size=1MB
server.tomcat.mbeanregistry.enabled=false

# Kubernetes-Import (Graph aus dem aktuellen kubeconfig-Kontext)
k8s.import.on-startup=${K8S_IMPORT_ON_STARTUP:true}
k8s.import.namespaces=${K8S_IMPORT_NAMESPACES:}
